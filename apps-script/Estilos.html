<!-- Dentro do Apps Script o Google Fonts carrega normalmente, então as fontes
     NÃO vão embutidas aqui. Isso mantém este arquivo pequeno (~32 KB) e fácil
     de colar no editor. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CadastroSB — Controle de Cadastro de Sobressalentes
   Identidade editorial: papel quente, fios de 1px, Archivo + IBM Plex Mono.
   Tema único e claro, pintado explicitamente.
   As fontes entram embutidas por Fontes.css (data URI, sem chamada externa).
   ========================================================================== */

:root {
  color-scheme: light;

  /* Papel e superfícies */
  --paper: #f5f4f1;
  --card: #ffffff;
  --card-2: #faf9f7;
  --card-3: #f0efec;

  /* Fios */
  --line: rgba(0, 0, 0, 0.09);
  --line-soft: rgba(0, 0, 0, 0.07);
  --line-strong: rgba(0, 0, 0, 0.14);

  /* Tinta */
  --ink: #16181a;
  --ink-2: #3c4045;
  --ink-3: #6d7278;
  --ink-4: #8b9096;
  --faint: #a9adb2;

  /* Status */
  --done: #1a8757;
  --done-bg: #eaf5ef;
  --cad: #2b62c9;
  --cad-bg: #e9eff9;
  --and: #d1892a;
  --and-bg: #fdf3e4;
  --wait: #8b9096;
  --wait-bg: #f0efec;
  --track: #e6e4df;

  /* Especialidades */
  --mec: #2e6b6f;
  --mec-bg: #e6f1f1;
  --ele: #6d48b8;
  --ele-bg: #efeaf8;

  --danger: #a3352f;
  --danger-bg: #f8ecea;

  --r: 10px;
  --r-lg: 12px;
  --sans: 'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { -webkit-text-size-adjust: 100%; }

body {
  font-family: var(--sans);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  line-height: 1.45;
}
::selection { background: #e3dfd2; color: var(--ink); }

/* Rótulo monoespaçado, o traço mais característico da peça */
.rot {
  font-family: var(--mono);
  font-size: 9.5px;
  font-weight: 400;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
}

.app { display: flex; min-height: 100vh; min-height: 100dvh; }

/* ===================== BARRA LATERAL ===================== */
.sidebar {
  width: 232px; flex-shrink: 0;
  background: var(--card-2);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding: 22px 18px 18px;
  position: sticky; top: 0; height: 100vh; height: 100dvh;
}

.brand { display: flex; align-items: center; gap: 11px; padding-bottom: 26px; }
.brand-icon {
  width: 34px; height: 34px; flex-shrink: 0; border-radius: 8px;
  background: var(--ink); color: #fff;
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
}
.brand h1 { font-size: 15.5px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.1; color: var(--ink); }
.brand h1 span { color: var(--ink); }
.brand p {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--ink-4); margin-top: 4px;
}

.nav { display: flex; flex-direction: column; gap: 1px; }
.nav-item {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 10px; background: none; border: none; cursor: pointer;
  font-family: var(--sans); font-size: 13.5px; font-weight: 500; color: var(--ink-3);
  border-radius: 7px; text-align: left; width: 100%;
  transition: background 0.15s, color 0.15s;
}
.nav-item:hover { background: var(--card-3); color: var(--ink); }
.nav-item.active { background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line); font-weight: 600; }
/* O número é a ordem do fluxo de trabalho, não decoração */
.nav-num {
  font-family: var(--mono); font-size: 9.5px; color: var(--faint);
  letter-spacing: 0.06em; flex-shrink: 0; width: 15px;
}
.nav-item.active .nav-num { color: var(--ink-4); }
.nav-ico { display: none; }

/* Resumo de conclusão no pé da barra */
.sidebar-foot { display: flex; flex-direction: column; flex: 1; margin-top: 20px; }
.sidebar-acoes { margin-top: auto; padding-top: 16px; }
.resumo-lateral {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 13px 14px;
}
.resumo-lateral .valor { display: flex; align-items: baseline; gap: 7px; margin-top: 8px; }
.resumo-lateral .pctg {
  font-size: 27px; font-weight: 700; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums; color: var(--ink); line-height: 1;
}
.resumo-lateral .frac { font-family: var(--mono); font-size: 10.5px; color: var(--ink-4); }
.resumo-lateral .prog-bar { margin-top: 11px; }

.sidebar-acoes { display: flex; flex-direction: column; gap: 6px; }
.btn-ghost {
  background: none; border: 1px solid var(--line); color: var(--ink-3);
  padding: 8px 10px; border-radius: 7px; font-size: 12px; font-weight: 500;
  font-family: var(--sans); cursor: pointer; transition: all 0.15s; text-align: center;
}
.btn-ghost:hover { background: var(--card); border-color: var(--line-strong); color: var(--ink); }
.btn-ghost.dark { background: var(--card); }
.file-label { display: block; }
.sync { font-family: var(--mono); font-size: 9px; color: var(--faint); text-align: center; padding-top: 9px; line-height: 1.6; letter-spacing: 0.03em; }

/* ===================== CONTEÚDO ===================== */
.content { flex: 1; padding: 30px 38px 64px; max-width: 1240px; width: 100%; }

.view-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 24px; flex-wrap: wrap; }
.view-header h2 { font-size: 25px; font-weight: 600; letter-spacing: -0.03em; color: var(--ink); }
.subtitle { font-size: 13px; color: var(--ink-3); margin-top: 5px; max-width: 62ch; }
.carimbo { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--faint); white-space: nowrap; padding-top: 8px; }
.hidden { display: none !important; }

.btn-primary {
  background: var(--ink); color: #fff; border: 1px solid var(--ink);
  padding: 9px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
  font-family: var(--sans); cursor: pointer; white-space: nowrap;
  transition: background 0.15s, border-color 0.15s;
}
.btn-primary:hover { background: #2e2c26; border-color: #2e2c26; }
.btn-primary:active { transform: translateY(0.5px); }

/* ===================== FAIXA DE INDICADORES ===================== */
.faixa {
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
  margin-bottom: 26px; overflow: hidden;
}
.kpi { padding: 18px 20px; border-right: 1px solid var(--line-soft); }
.kpi:last-child { border-right: none; }
.kpi-valor {
  font-size: 34px; font-weight: 700; letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums; line-height: 1; margin-top: 9px; color: var(--ink);
  display: flex; align-items: baseline; gap: 8px;
}
.kpi-valor .pctg { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink-4); }
.kpi-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 7px; }
.kpi.k-done .kpi-valor { color: var(--done); }
.kpi.k-cad .kpi-valor { color: var(--cad); }
.kpi.k-and .kpi-valor { color: var(--and); }
.kpi.k-wait .kpi-valor { color: var(--ink-2); }

/* ===================== SEÇÕES ===================== */
.secao { margin-bottom: 26px; }
.secao-topo { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.secao-topo h3 { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); white-space: nowrap; }
.secao-linha { flex: 1; height: 1px; background: var(--line); }
.legenda { display: flex; gap: 13px; flex-wrap: wrap; }
.legenda span { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-3); white-space: nowrap; }
.legenda i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
.lg-done { background: var(--done); }
.lg-cad { background: var(--cad); }
.lg-and { background: var(--and); }
.lg-wait { background: var(--track); }

.painel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

/* ===================== LINHAS DE PROGRESSO ===================== */
.prog-list { display: flex; flex-direction: column; }
.prog-row {
  display: grid; grid-template-columns: minmax(120px, 190px) 1fr auto auto;
  align-items: center; gap: 16px; padding: 13px 18px;
  border-bottom: 1px solid var(--line-soft);
}
.prog-row:last-child { border-bottom: none; }
.prog-name { font-size: 13px; font-weight: 500; color: var(--ink); display: flex; align-items: center; gap: 8px; min-width: 0; }
.prog-name .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog-meta { font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; }
.prog-meta b { color: var(--done); font-weight: 500; }
.prog-pct {
  font-size: 13px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums;
  min-width: 38px; text-align: right; letter-spacing: -0.01em;
}

.prog-bar { height: 7px; border-radius: 4px; background: var(--track); overflow: hidden; display: flex; }
.prog-bar .seg { height: 100%; transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1); }
.seg-done { background: var(--done); }
.seg-cad { background: var(--cad); }
.seg-and { background: var(--and); }

button.prog-row {
  width: 100%; background: none; border: none; border-bottom: 1px solid var(--line-soft);
  font-family: var(--sans); cursor: pointer; text-align: left; color: var(--ink);
  transition: background 0.14s;
}
button.prog-row:last-child { border-bottom: none; }
button.prog-row:hover { background: var(--card-2); }
button.prog-row:hover .prog-ir { opacity: 1; }
.prog-ir { color: var(--ink-4); opacity: 0; transition: opacity 0.16s; flex-shrink: 0; font-size: 11px; }
button.prog-row:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -2px; }

/* ===================== ETIQUETAS ===================== */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap;
}
.chip::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.c-done { background: var(--done-bg); color: var(--done); }
.c-cad  { background: var(--cad-bg);  color: var(--cad); }
.c-and  { background: var(--and-bg);  color: var(--and); }
.c-wait { background: var(--wait-bg); color: var(--wait); }
.chip.esp::before { display: none; }
.c-mec { background: var(--mec-bg); color: var(--mec); }
.c-ele { background: var(--ele-bg); color: var(--ele); }

.ni-tag {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
  background: var(--card-3); padding: 3px 7px; border-radius: 5px;
  display: inline-block; white-space: nowrap; letter-spacing: 0.02em;
}
.ni-empty { font-family: var(--mono); font-size: 10px; color: var(--faint); letter-spacing: 0.04em; }

/* ===================== BARRA DE FERRAMENTAS ===================== */
.toolbar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.search, .select {
  padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
  font-size: 13px; font-family: var(--sans); background: var(--card); color: var(--ink);
  transition: border-color 0.14s, box-shadow 0.14s;
}
.search { flex: 1; min-width: 210px; }
.select { cursor: pointer; }
.search::placeholder { color: var(--faint); }
.search:focus, .select:focus,
.field input:focus, .field select:focus, .field textarea:focus {
  outline: none; border-color: var(--ink-4); box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.045);
}

/* ===================== GRADE DE EQUIPAMENTOS ===================== */
.equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(272px, 1fr)); gap: 14px; }
.equip-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 18px; cursor: pointer; text-align: left; font-family: var(--sans); color: var(--ink);
  display: flex; flex-direction: column; gap: 15px;
  transition: border-color 0.15s, background 0.15s;
}
.equip-card:hover { border-color: var(--line-strong); background: var(--card-2); }
.equip-card:hover .equip-go { color: var(--ink); }
.equip-card:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 1px; }

.equip-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; }
.equip-id { min-width: 0; flex: 1; }
.equip-nome { font-size: 15.5px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; overflow-wrap: anywhere; }
.equip-sub { font-family: var(--mono); font-size: 9.5px; color: var(--ink-4); margin-top: 6px; letter-spacing: 0.06em; }
.equip-pct {
  font-size: 24px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
  font-variant-numeric: tabular-nums; color: var(--ink); flex-shrink: 0;
}

.equip-stats { display: flex; }
.equip-stats .stat { flex: 1; border-left: 1px solid var(--line-soft); padding-left: 10px; }
.equip-stats .stat:first-child { border-left: none; padding-left: 0; }
.stat b {
  display: block; font-size: 15px; font-weight: 600; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; margin-bottom: 3px;
}
.stat span { font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-4); }
.stat.s-done b { color: var(--done); }
.stat.s-cad b { color: var(--cad); }
.stat.s-and b { color: var(--and); }
.stat.s-wait b { color: var(--ink-2); }

.equip-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 13px; border-top: 1px solid var(--line-soft); }
.equip-esp { display: flex; gap: 5px; flex-wrap: wrap; }
.equip-go { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-4); white-space: nowrap; transition: color 0.15s; }

/* ===================== FICHA DO EQUIPAMENTO ===================== */
.btn-voltar {
  background: none; border: none; color: var(--ink-3); font-family: var(--mono);
  font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer;
  padding: 6px 10px 6px 0; margin-bottom: 16px; transition: color 0.14s;
}
.btn-voltar:hover { color: var(--ink); }

.ficha-head { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px 24px; margin-bottom: 18px; }
.ficha-topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; flex-wrap: wrap; }
.ficha-titulo { min-width: 0; }
.ficha-eyebrow {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--ink-4);
}
.ficha-titulo h2 { font-size: 24px; font-weight: 600; letter-spacing: -0.03em; margin-top: 7px; overflow-wrap: anywhere; }
.ficha-acoes { display: flex; gap: 7px; }
.btn-sec {
  background: var(--card); border: 1px solid var(--line); color: var(--ink-2);
  padding: 8px 13px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
  font-family: var(--sans); cursor: pointer; transition: all 0.14s; white-space: nowrap;
}
.btn-sec:hover { background: var(--card-2); border-color: var(--line-strong); color: var(--ink); }
.btn-sec.danger:hover { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

.ficha-resumo { display: flex; align-items: center; gap: 20px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
.ficha-pct { font-size: 32px; font-weight: 700; letter-spacing: -0.045em; font-variant-numeric: tabular-nums; line-height: 1; }
.ficha-barra { flex: 1; min-width: 220px; }
.ficha-barra .prog-bar { height: 9px; }
.ficha-conta { font-family: var(--mono); font-size: 10px; color: var(--ink-4); margin-top: 10px; letter-spacing: 0.05em; }
.ficha-conta b { color: var(--done); font-weight: 500; }

/* Blocos de parte */
.parte { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 12px; overflow: hidden; }
.parte-head {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px 11px 18px;
  background: var(--card-2); width: 100%; cursor: pointer;
  border: none; border-bottom: 1px solid var(--line-soft);
  font-family: var(--sans); color: var(--ink); text-align: left; transition: background 0.14s;
}
.parte-head:focus-visible { outline: 1.5px solid var(--ink); outline-offset: -2px; }
.parte-head:hover { background: var(--card-3); }
.parte-seta { font-size: 8px; color: var(--faint); transition: transform 0.2s; flex-shrink: 0; }
.parte.fechada .parte-seta { transform: rotate(-90deg); }
.parte.fechada .parte-corpo { display: none; }
.parte-nome { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.parte-mini { width: 78px; flex-shrink: 0; }
.parte-mini .prog-bar { height: 5px; }
.parte-conta { font-family: var(--mono); font-size: 10px; color: var(--faint); flex-shrink: 0; min-width: 34px; text-align: right; }
.parte-conta b { color: var(--done); font-weight: 500; }
.parte-seta-btn {
  display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
  background: none; border: none; cursor: pointer; padding: 0;
  font-family: inherit; color: inherit; text-align: left;
}
.parte-seta-btn:focus-visible { outline: 1.5px solid var(--ink); outline-offset: 2px; border-radius: 6px; }
.parte-acoes { display: flex; gap: 3px; flex-shrink: 0; }

.comp {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(84px, auto) minmax(0, auto) minmax(100px, auto) auto;
  gap: 10px 14px; align-items: center; padding: 11px 18px; border-bottom: 1px solid var(--line-soft);
}
.comp:last-child { border-bottom: none; }
.comp:hover { background: var(--card-2); }
.comp-nome { font-size: 13.5px; font-weight: 500; min-width: 0; }
.comp-obs { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height: 1.45; }
.comp-ni, .comp-esp, .comp-status { justify-self: start; }
.comp-resp { font-size: 12px; color: var(--ink-3); justify-self: end; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-acoes { display: flex; gap: 4px; }

.parte-add {
  padding: 10px 18px; background: none; border: none; border-top: 1px dashed var(--line);
  font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-4); cursor: pointer; width: 100%; text-align: left; transition: all 0.14s;
}
.parte-add:hover { background: var(--card-2); color: var(--ink); }

/* ===================== TABELA ===================== */
.table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; padding: 11px 16px; background: var(--card-2);
  border-bottom: 1px solid var(--line); white-space: nowrap;
  font-family: var(--mono); font-size: 8.5px; font-weight: 400;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-4);
}
tbody td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--card-2); }
.cell-strong { font-weight: 500; color: var(--ink); }
.cell-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.crumb { display: none; }
.counter { font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-top: 12px; letter-spacing: 0.06em; }

.row-actions { display: flex; gap: 4px; }
.icon-btn {
  border: 1px solid var(--line); background: var(--card); cursor: pointer;
  width: 30px; height: 30px; border-radius: 7px; font-size: 12px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3); transition: all 0.13s;
}
.icon-btn:hover { background: var(--card-2); border-color: var(--line-strong); }
.icon-btn.danger:hover { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }

/* ===================== ESTADOS VAZIOS ===================== */
.empty { padding: 46px 20px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
